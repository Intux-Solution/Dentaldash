server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (aplicados a todas las respuestas)
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    location / {
        try_files $uri $uri/ /index.html;

        # index.html NO se cachea: es el unico archivo sin hash en el nombre y
        # es quien apunta a los bundles nuevos. Sin esto el navegador aplica
        # frescura heuristica y sigue sirviendo la build anterior tras un deploy.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Re-incluido: el add_header de arriba cancela la herencia del bloque server.
        include /etc/nginx/security-headers.conf;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        # Re-incluido: el add_header de abajo cancela la herencia del bloque server.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
