# Headers de seguridad compartidos.
#
# nginx NO hereda los add_header de un bloque padre en cuanto el bloque hijo
# declara su propio add_header. Por eso este archivo se incluye explicitamente
# en cada location que agrega headers propios (ej: Cache-Control de assets),
# en lugar de confiar en la herencia desde el bloque server.
#
# Vive en /etc/nginx/ y no en /etc/nginx/conf.d/, porque nginx auto-carga
# conf.d/*.conf dentro del bloque http y lo parsearia por duplicado.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co https://api.mercadopago.com https://www.googleapis.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self' blob: https://*.supabase.co; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
